[package]
name = "streamer"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
moonlight-common = { workspace = true }
common = { workspace = true }
transport-core = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread"] }
webrtc = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }

num = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }

log = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
# Cursor P1 tracker (GetCursorInfo 60 Hz poll — cursor-channel.md §3) +
# clipboard sync v1 (GetClipboardSequenceNumber 500 ms poll + CF_UNICODETEXT
# via GlobalAlloc/Lock — clipboard.rs) + P2 cursor shape extraction
# (GetIconInfoExW/GetDIBits — cursor-channel.md §P2, cursor_tracker.rs).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
] }
# P2 cursor shape PNG encoding (cursor_tracker.rs extract_shape).
png = "0.18.1"

[lints]
workspace = true
