[package]
name = "app-native"
version.workspace = true
edition = "2024"
license.workspace = true

[[bin]]
name = "betterparsec"
path = "src/main.rs"
[[bin]]
name = "nvenc-slice-probe"
path = "src/bin/nvenc_slice_probe.rs"
required-features = ["video"]

[dependencies]
client-transport = { path = "../client-transport" }
transport-core = { workspace = true }
# A1 host role: embedded account/pairing/signaling server (design D1/D3).
web-server = { path = ".." }
common = { workspace = true }
# A2 input: wire-format field types (common::input_wire re-uses them).
moonlight-common = { workspace = true, optional = true }

# A0 shell: egui via eframe (glow backend — the stream surface will live on
# its own raw D3D11 HWND per unified-app-architecture.md D5/D9, so the
# chrome renderer stays lightweight and independent).
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }

tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# A0 slice 2: H.264 decode via FFmpeg (BtbN LGPL shared pin,
# tools/bootstrap-ffmpeg.ps1 -> third-party/ffmpeg -> FFMPEG_DIR from
# .cargo/config.toml). Optional so builds work without FFmpeg present.
ffmpeg-sys-next = { version = "7.1", optional = true, default-features = false, features = [
    "avcodec",
    "swscale",
] }
libc = { version = "0.2", optional = true }
# M4 cursor P2 native render: SHAPE PNG decode → HCURSOR (cursor_icon.rs).
png = { version = "0.17", optional = true }

# A0 slice 3: raw D3D11 FLIP_DISCARD present surface (design D5). The
# stream child HWND + swapchain live outside egui; raw-window-handle
# fetches the parent HWND from eframe.
raw-window-handle = "0.6"


[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = []
video = [
    "dep:ffmpeg-sys-next",
    "dep:libc",
    "dep:windows",
    "dep:moonlight-common",
    "dep:png",
]

[dev-dependencies]
# host.rs tests serialize a Config fixture instead of hand-writing JSON.
serde_json = { workspace = true }

[lints]
workspace = true
